<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travels Management</title>
    <link rel="stylesheet" href="assets/base.css">
    <link rel="stylesheet" href="assets/maintain.css">
    <link rel="stylesheet" href="assets/auth.css">

</head>
<body>
    <header id="header">

    </header>

    <section id="search">
        <div class="search_container">
            <form action="/travel_maintain/get_travel" method="post">
                <label for="travelId">travelId:</label>
                    <input type="text" name="travelId" id="travelId" placeholder="Into travel ID" required>
                    <button id="search_button">Search</button>
            </form>
        </div>
    </section>

    <section id="data_container">
        
      
    </section>

    <section id="operations">
        <div class="operations_container">
            <button id="delete_btn">Delete Travel</button>
            <button id="edit_btn">Edit Travel</button>
        </div>
    </section>


    <section id="data_edit">
        <form action="/travel_maintain/edit_travel" method="post"></form>
        <label for="n_destination">New Destination: </label>
        <input type="text" name="n_destination" id="n_destination">

        <label for="n_activity">New Activity: </label>
        <input type="text" name="n_activity" id="n_activity">

        <label for="n_price">New Price</label>
        <input type="number" name="n_price" id="n_price">

        <label for="n_available_seats">Available_Seats</label>
        <input type="number" name="n_available_seats" id="n_available_seats">


        <label for="n_duration">Duration</label>
        <input type="number" name="n_duration" id="n_duration">

        <label for="n_image">New Image</label>
        <input type="file" name="n_image" id="n_image">

        <button id="edit_submit">submit</button>
    </section>

    <footer id="footer">

    </footer>

    <script src="scripts/components.js"></script>
    <script src="scripts/travel_management.js"></script>
</body>
</html>
