<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="assets/base.css">
    <link rel="stylesheet" href="assets/auth.css">

</head>

<body>
    <header id="header">

    </header>

    <section class="user_search">
        <div class="search_container">
            <form action="/user_maintain/get_user" method="post">
                <label for="userId">userId:</label>
                <input type="text" name="userId" id="userId" placeholder="Into user ID" required>
                <button id="button">Search</button>
            </form>
        </div>
    </section>

    <section id="user_container">
        <div class="admin_operation">
            <button disabled id="delete_btn">Delete user</button>
            <button disabled id="edit_btn">Edit user</button>
        </div>
    </section>

    <section id="user_edit">
        <form action="/user_maintain/edit_user" method="post"></form>
        <label for="n_username">New Username: </label>
        <input type="text" name="n_username" id="n_username">

        <label for="n_age">New Age: </label>
        <input type="number" name="n_age" id="n_age">

        <label for="n_email">New Email</label>
        <input type="email" name="n_email" id="n_email">

        <label for="n_password">New Password</label>
        <input type="password" name="n_password" id="n_password">

        <label for="n_image">New Image</label>
        <input type="file" name="n_image" id="n_image">

        <button id="edit_submit">submit</button>
    </section>



    <footer id="footer">

    </footer>

    <script src="scripts/components.js"></script>
    <script src="scripts/users_management.js"></script>
</body>

</html>
