<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve - Travel</title>
    <link rel="stylesheet" href="assets/base.css">
    <link rel="stylesheet" href="assets/home.css">
    <link rel="stylesheet" href="assets/auth.css">
</head>
<body>
    <header id="header"></header>

    <main>
        <section class="reserve_form">
            <form id="form" action="/travel/reserve_travel" method="post">
                <div class="form-container">
                    <h1>Reserve Travel</h1>
                    <label for="destination">Destination</label>
                    <input type="text" id="destination" name="destination">
                    <label for="companions">Companions</label>
                    <input type="number" id="companions" name="companions">
                    <label for="include_food">Include_Food</label>
                    <input type="checkbox" id="include_food" name="include_food">
        
                    <button id="form-button">Submit</button>
                </div>
            </form>        
        </section>
    </main>

    <footer id="footer"></footer>
    <script src="scripts/auth.js"></script>
    <script src="scripts/components.js"></script>
    <script src="scripts/reserve_travel.js"></script>
</body>
</html>
